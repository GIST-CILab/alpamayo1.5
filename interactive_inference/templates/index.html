<!DOCTYPE html>
<html>
<head>
    <title>Alpamayo 1.5 Interactive Inference</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded shadow-md">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">Alpamayo 1.5 Inference Server</h1>
        
        <div class="grid grid-cols-2 gap-4">
            <a href="/data_check" class="block p-6 bg-blue-50 hover:bg-blue-100 rounded border border-blue-200">
                <h2 class="text-xl font-semibold mb-2 text-blue-800">1. Data Check</h2>
                <p class="text-gray-600">Verify your clip_id and t0_relative by displaying the front camera frame.</p>
            </a>
            
            <a href="/inference" class="block p-6 bg-green-50 hover:bg-green-100 rounded border border-green-200">
                <h2 class="text-xl font-semibold mb-2 text-green-800">2. Interactive Inference</h2>
                <p class="text-gray-600">Enter model parameters, text instructions, and run trajectory generation.</p>
            </a>
        </div>
    </div>
</body>
</html>
